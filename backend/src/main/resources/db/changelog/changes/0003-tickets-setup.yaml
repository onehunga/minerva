databaseChangeLog:
  - changeSet:
      id: 0003-tickets-setup
      author: julian
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createSequence:
            sequenceName: ticket_types_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: ticket_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: ticket_types_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_ticket_types
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_types_project_id
                    references: projects(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createSequence:
            sequenceName: workflows_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: workflows
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: workflows_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_workflows
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflows_project_id
                    references: projects(id)
              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflows_ticket_type_id
                    references: ticket_types(id)
        - createSequence:
            sequenceName: workflow_states_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: workflow_states
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: workflow_states_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_workflow_states
              - column:
                  name: workflow_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_states_workflow_id
                    references: workflows(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: workflow_status_category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createSequence:
            sequenceName: tickets_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: tickets_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_tickets
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_project_id
                    references: projects(id)
              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_type_id
                    references: ticket_types(id)
              - column:
                  name: status_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_status_id
                    references: workflow_states(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_created_by
                    references: users(id)
              - column:
                  name: assigned_to
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_tickets_assigned_to
                    references: users(id)
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createSequence:
            sequenceName: workflow_transitions_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: workflow_transitions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: workflow_transitions_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_workflow_transitions
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: from_state
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_transitions_from_state
                    references: workflow_states(id)
              - column:
                  name: to_state
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_transitions_to_state
                    references: workflow_states(id)
        - createSequence:
            sequenceName: ticket_child_rule_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: ticket_child_rules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: ticket_child_rule_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_ticket_child_rules
              - column:
                  name: parent_ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_child_rules_parent_ticket_id
                    references: tickets(id)
              - column:
                  name: child_ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_child_rules_child_ticket_id
                    references: tickets(id)
        - sql:
            sql: ALTER TABLE workflow_states ADD CONSTRAINT chk_workflow_states_workflow_status_category CHECK (workflow_status_category IN ('OPEN', 'IN_PROGRESS', 'COMPLETED'));

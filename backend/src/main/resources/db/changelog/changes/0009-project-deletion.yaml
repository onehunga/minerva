databaseChangeLog:
  - changeSet:
      id: 0009-project-deletion
      author: julian
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - dropForeignKeyConstraint:
            baseTableName: project_roles
            constraintName: fk_project_roles_project_id
        - addForeignKeyConstraint:
            constraintName: fk_project_roles_project_id
            baseTableName: project_roles
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: project_members
            constraintName: fk_project_members_project_id
        - addForeignKeyConstraint:
            constraintName: fk_project_members_project_id
            baseTableName: project_members
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: ticket_types
            constraintName: fk_ticket_types_project_id
        - addForeignKeyConstraint:
            constraintName: fk_ticket_types_project_id
            baseTableName: ticket_types
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workflows
            constraintName: fk_workflows_project_id
        - addForeignKeyConstraint:
            constraintName: fk_workflows_project_id
            baseTableName: workflows
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workflow_states
            constraintName: fk_workflow_states_workflow_id
        - addForeignKeyConstraint:
            constraintName: fk_workflow_states_workflow_id
            baseTableName: workflow_states
            baseColumnNames: workflow_id
            referencedTableName: workflows
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workflow_transitions
            constraintName: fk_workflow_transitions_from_state
        - addForeignKeyConstraint:
            constraintName: fk_workflow_transitions_from_state
            baseTableName: workflow_transitions
            baseColumnNames: from_state
            referencedTableName: workflow_states
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workflow_transitions
            constraintName: fk_workflow_transitions_to_state
        - addForeignKeyConstraint:
            constraintName: fk_workflow_transitions_to_state
            baseTableName: workflow_transitions
            baseColumnNames: to_state
            referencedTableName: workflow_states
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: tickets
            constraintName: fk_tickets_project_id
        - addForeignKeyConstraint:
            constraintName: fk_tickets_project_id
            baseTableName: tickets
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: ticket_child_rules
            constraintName: fk_ticket_child_rules_parent_ticket_id
        - addForeignKeyConstraint:
            constraintName: fk_ticket_child_rules_parent_ticket_id
            baseTableName: ticket_child_rules
            baseColumnNames: parent_ticket_id
            referencedTableName: ticket_types
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: ticket_child_rules
            constraintName: fk_ticket_child_rules_child_ticket_id
        - addForeignKeyConstraint:
            constraintName: fk_ticket_child_rules_child_ticket_id
            baseTableName: ticket_child_rules
            baseColumnNames: child_ticket_id
            referencedTableName: ticket_types
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: ticket_comments
            constraintName: fk_ticket_comments_ticket_id
        - addForeignKeyConstraint:
            constraintName: fk_ticket_comments_ticket_id
            baseTableName: ticket_comments
            baseColumnNames: ticket_id
            referencedTableName: tickets
            referencedColumnNames: id
            onDelete: CASCADE
        # Activity scopes: cascade when the parent event is deleted during project cleanup
        - dropForeignKeyConstraint:
            baseTableName: activity_scopes
            constraintName: fk_activity_scopes_event_id
        - addForeignKeyConstraint:
            constraintName: fk_activity_scopes_event_id
            baseTableName: activity_scopes
            baseColumnNames: event_id
            referencedTableName: activity_events
            referencedColumnNames: id
            onDelete: CASCADE

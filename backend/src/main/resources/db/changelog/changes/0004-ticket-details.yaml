databaseChangeLog:
  - changeSet:
      id: 0004-ticket-details
      author: julian
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createSequence:
            sequenceName: ticket_comments_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: ticket_comments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: ticket_comments_id_seq
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_ticket_comments
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_comments_ticket_id
                    references: tickets(id)
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_comments_author_id
                    references: users(id)
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
